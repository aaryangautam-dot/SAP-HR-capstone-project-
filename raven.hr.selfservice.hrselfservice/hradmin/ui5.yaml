specVersion: "4.0"

metadata:
  name: hradmin

type: application

server:
  customMiddleware:

    - name: fiori-tools-proxy
      afterMiddleware: compression

      configuration:
        ignoreCertErrors: false

        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com

        backend:
          - path: /odata/v4/hr
            url: http://localhost:4004

    - name: fiori-tools-appreload
      afterMiddleware: compression

      configuration:
        port: 35730
        path: webapp
        delay: 300

builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
