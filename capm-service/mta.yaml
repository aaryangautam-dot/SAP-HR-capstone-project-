_schema-version: "3.3"
ID: capm-service
version: 1.0.0

modules:

  - name: capm-service-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: capm-service-db
      - name: capm-service-auth
      - name: capm-service-destination
      - name: capm-service-spa-workflow
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      memory: 256M
      buildpack: nodejs_buildpack

  - name: capm-service-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: capm-service-db
    parameters:
      buildpack: nodejs_buildpack

resources:

  - name: capm-service-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: capm-service-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application

  - name: capm-service-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: capm-service-spa-workflow
    type: org.cloudfoundry.managed-service
    parameters:
      service: process-automation-service
      service-plan: standard